defaults:
  - default_train_params


warmup_mode: "LinearBatchLRWarmup"
warmup_initial_lr:  1e-6
lr_warmup_steps: 128
lr_warmup_epochs: 10

initial_lr:  2e-3
lr_mode: cosine
cosine_final_lr_ratio: 0.05

zero_weight_decay_on_bias_and_bn: True
batch_accumulate: 1
normalize_accumulated_gradients: True

average_best_models: True
save_ckpt_epoch_list: [300, 500, 600, 700, 800, 900, 1000]

loss: chess_yolo_nas_pose_loss

criterion_params:
    board_oks_sigmas: ${dataset_params.board_oks_sigmas}
    piece_oks_sigma: ${dataset_params.piece_oks_sigma}
    board_class_id: 12
    num_classes: ${dataset_params.num_classes}
    # Loss weights and assigner settings are the upstream yolo_nas_pose defaults.
    classification_loss_weight: 1.0
    classification_loss_type: focal
    regression_iou_loss_type: ciou
    iou_loss_weight: 2.5
    dfl_loss_weight: 0.01
    pose_cls_loss_weight: 1.0
    pose_reg_loss_weight: 34.0
    pose_classification_loss_type: focal
    # Board flags mean annotated coordinates, not physical visibility.
    ignore_unannotated_board_keypoints: True
    rescale_pose_loss_with_assigned_score: True
    assigner_multiply_by_pose_oks: True
    bbox_assigner_topk: 13
    bbox_assigned_alpha: 1.0
    bbox_assigned_beta: 6.0
    # From this epoch on, a board scored 180 degrees out is accepted as correct.
    rotation_invariant_start_epoch: 0
    rotation_invariant_max_pieces: 6
    board_localization_loss_multiplier: 2.0
    log_pose_diagnostics: True

optimizer: AdamW
optimizer_params:
  weight_decay: 0.000001

ema: True
ema_params:
  decay: 0.997
  decay_type: threshold

mixed_precision: True
sync_bn: False

valid_metrics_list:
  - ChessPoseEstimationMetrics:
      num_joints: ${dataset_params.num_joints}
      oks_sigmas: ${dataset_params.oks_sigmas}
      max_objects_per_image: 50
      board_class_id: 12
      # Every reference point must stay within this many squares on EACH rectified axis.
      # Applies only to Board_* metrics; overall AP/AR retain their original OKS matching.
      board_max_square_error: 0.25
      board_keypoint_confidence_threshold: 0.7
      # Piece_mAP + Piece_AP/<class> and color accuracy: annotated board, no piece cutoff.
      # End-to-end square error: predicted board, validation-tuned piece cutoff (cached sweep).
      # Confusion + FP/FN percentages: predicted board, fixed cutoff below.
      # All use raw output without NMS; post_prediction_callback below does not apply.
      piece_metrics: True
      piece_confidence_threshold: 0.05
      piece_board_keypoint_threshold: 0.2
      piece_image_size:
        - ${dataset_params.image_width}
        - ${dataset_params.image_height}
      post_prediction_callback:
        _target_: super_gradients.training.models.pose_estimation_models.yolo_nas_pose.ChessYoloNASPosePostPredictionCallback
        pose_confidence_threshold: 0.35
        nms_iou_threshold: 0.7
        pre_nms_max_predictions: 300
        post_nms_max_predictions: 50

run_validation_freq: 10

phase_callbacks:
  - ChessBoardRotationInvarianceCallback
  - ChessPieceConfusionCallback
  - EarlyStop:
      phase:
        _target_: super_gradients.training.utils.callbacks.base_callbacks.Phase
        value: VALIDATION_EPOCH_END
      monitor: AP
      mode: max
      min_delta: 0.0001
      patience: 1000
      verbose: True

pre_prediction_callback:

metric_to_watch: 'Board_Relaxed_AP'
greater_metric_to_watch_is_better: True

_convert_: all
