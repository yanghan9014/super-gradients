defaults:
  - default_train_params


warmup_mode: "LinearBatchLRWarmup"
warmup_initial_lr:  1e-6
lr_warmup_steps: 128
lr_warmup_epochs: 10

initial_lr:  2e-3
lr_mode: cosine
cosine_final_lr_ratio: 0.05

zero_weight_decay_on_bias_and_bn: True
batch_accumulate: 1

average_best_models: True
save_ckpt_epoch_list: [300, 500]

loss: chess_yolo_nas_pose_loss

criterion_params:
    board_oks_sigmas: ${dataset_params.board_oks_sigmas}
    piece_oks_sigma: ${dataset_params.piece_oks_sigma}
    board_class_id: 12
    num_classes: ${dataset_params.num_classes}
    classification_loss_weight: 1.0
    quality_loss_weight: 1.0
    pose_cls_loss_weight: 1.0
    pose_reg_loss_weight: 50.0
    piece_quality_sigma: ${dataset_params.piece_quality_sigma}
    board_quality_sigma: ${dataset_params.board_quality_sigma}
    piece_candidate_radius: ${dataset_params.piece_candidate_radius}
    alignment_warmup_iterations: 1000
    alignment_support_delta: 0.5
    max_positives_per_gt: 32  # Safety cap; adaptive likelihood support normally selects fewer.
    # board_localization_loss_multiplier: 5.0

optimizer: AdamW
optimizer_params:
  weight_decay: 0.000001

ema: True
ema_params:
  decay: 0.997
  decay_type: threshold

mixed_precision: True
sync_bn: False

valid_metrics_list:
  - ChessPoseEstimationMetrics:
      num_joints: ${dataset_params.num_joints}
      oks_sigmas: ${dataset_params.oks_sigmas}
      max_objects_per_image: 50
      post_prediction_callback:
        _target_: super_gradients.training.models.pose_estimation_models.yolo_nas_pose.ChessYoloNASPosePostPredictionCallback
        pose_confidence_threshold: 0.35
        pre_nms_max_predictions: 300
        post_nms_max_predictions: 50

run_validation_freq: 10

phase_callbacks:
  # You can uncomment this callback to visualize predictions during training
  - ExtremeBatchPoseEstimationVisualizationCallback:
      keypoint_colors: ${dataset_params.keypoint_colors}
      edge_colors: ${dataset_params.edge_colors}
      edge_links: ${dataset_params.edge_links}
      loss_to_monitor: ChessYoloNASPoseLoss/loss
      max: True
      freq: 1
      max_images: 16
      enable_on_train_loader: True
      enable_on_valid_loader: True
      post_prediction_callback:
        _target_: super_gradients.training.models.pose_estimation_models.yolo_nas_pose.ChessYoloNASPosePostPredictionCallback
        pose_confidence_threshold: 0.35
        pre_nms_max_predictions: 300
        post_nms_max_predictions: 50

  - EarlyStop:
      phase:
        _target_: super_gradients.training.utils.callbacks.base_callbacks.Phase
        value: VALIDATION_EPOCH_END
      monitor: AP
      mode: max
      min_delta: 0.0001
      patience: 100
      verbose: True

  - S3SyncCallback:
      s3_bucket: "chessvision-checkpoints"
      s3_prefix: "training_logs"

pre_prediction_callback:

metric_to_watch: 'AP'
greater_metric_to_watch_is_better: True

_convert_: all
