defaults:
  - chess_pose_estimation_yolo_nas_dataset_params
  - _self_

num_classes: 21
oks_sigmas: [0.5]
flip_indexes: [0]
edge_links: 
  - [0, 1]
edge_colors: 
  - [214, 39, 40]
keypoint_colors:
