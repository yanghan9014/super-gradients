defaults:
  - chess_pose_estimation_yolo_nas_dataset_params
  - _self_

num_classes: 13    # 12 piece types + 1 board
num_joints: 9      # max keypoints (pieces use kp[0] only, board uses kp[0..8])
oks_sigmas: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]  # 9 sigmas
board_oks_sigmas: [0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5, 0.5]
piece_oks_sigma: [0.5]
flip_indexes: [0, 1, 2, 3, 4, 5, 6, 7, 8]
edge_links: 
  - [0, 1]
edge_colors: 
  - [214, 39, 40]
keypoint_colors:
  - [255, 0, 0]
  - [0, 255, 0]
  - [0, 0, 255]
  - [255, 255, 0]
  - [255, 0, 255]
  - [0, 255, 255]
  - [128, 0, 0]
  - [0, 128, 0]
  - [0, 0, 128]

train_dataset_params:
  data_dir: data/chess_pose
  images_dir: images/train
  json_file: annotations/person_keypoints_train.json

val_dataset_params:
  data_dir: data/chess_pose
  images_dir: images/val
  json_file: annotations/person_keypoints_val.json

train_dataloader_params:
  batch_size: 32

val_dataloader_params:
  batch_size: 32
