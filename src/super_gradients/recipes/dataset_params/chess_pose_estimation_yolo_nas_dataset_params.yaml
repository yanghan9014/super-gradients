defaults:
  - _self_

num_joints: 9

# This is a shortcut parameter to set size of training & validation images.
image_width: 640
image_height: 480
dataset_params_suffix: "${dataset_params.image_width}x${dataset_params.image_height}"

train_dataset_params:
  data_dir: /data/coco # root path to coco data
  images_dir: images/train2017
  json_file: annotations/person_keypoints_train2017.json

  edge_links: ${dataset_params.edge_links}
  edge_colors: ${dataset_params.edge_colors}
  keypoint_colors: ${dataset_params.keypoint_colors}

  include_empty_samples: True
  preserve_out_of_frame_board_annotations: True
  crowd_annotations_action: mask_as_normal
  # Shrink on load: the transforms below never enlarge beyond this, so detail is unchanged.
  load_size:
    - ${dataset_params.image_width}
    - ${dataset_params.image_height}
  # Piece boxes span one board square around the piece (see ChessPoseEstimationDataset).
  piece_box_squares: 1.0

  transforms:

    - KeypointsBrightnessContrast:
        brightness_range: [ 0.4, 1.6 ]
        contrast_range: [ 0.8, 1.2 ]
        prob: 1.0

    - KeypointsHSV:
        hgain: 40
        sgain: 20
        vgain: 20
        prob: 1.0

    # Appearance precedes geometry so newly added padding remains black.
    # Disabled for the next appearance-augmentation experiment.
    # - KeypointsImageOnlyAugmentation:
    #     transforms:
    #       - GaussianBlur:
    #           blur_limit: [3, 7]
    #           p: 0.2
    #       - GaussNoise:
    #           var_limit: [10.0, 50.0]
    #           p: 0.2
    #       - ImageCompression:
    #           quality_lower: 50
    #           quality_upper: 95
    #           p: 0.2

    # Frame the board in a 4:3 window like the app's camera crop, at a random size and position.
    - KeypointsBoardFramedCrop:
        output_height: ${dataset_params.image_height}
        output_width: ${dataset_params.image_width}
        randomize: True
        preserve_out_of_frame_board_annotations: True
        max_board_fraction: 0.85
        min_board_fraction: 0.5
        image_pad_value: [0, 0, 0]
        mask_pad_value: 1

    # Check the combined geometry before warping: allow modest clipping, never most of a board.
    - KeypointsBoardSafeGeometry:
        max_rotation: 90
        max_shear: 5
        distortion_scale: 0.15
        perspective_prob: 0.5
        min_retained_fraction: 0.75
        min_visible_keypoints: 4
        max_attempts: 20
        image_pad_value: [0, 0, 0]
        mask_pad_value: 1

    - KeypointsImageStandardize:
        max_value: 255

    - KeypointsRemoveSmallObjects:
        min_instance_area: 1
        min_visible_keypoints: 1


val_dataset_params:
  data_dir: /data/coco/
  images_dir: images/val2017
  json_file: annotations/person_keypoints_val2017.json

  edge_links: ${dataset_params.edge_links}
  edge_colors: ${dataset_params.edge_colors}
  keypoint_colors: ${dataset_params.keypoint_colors}

  include_empty_samples: True
  preserve_out_of_frame_board_annotations: True
  crowd_annotations_action: no_action
  # Shrink on load: the transforms below never enlarge beyond this, so detail is unchanged.
  load_size:
    - ${dataset_params.image_width}
    - ${dataset_params.image_height}
  # Piece boxes span one board square around the piece (see ChessPoseEstimationDataset).
  piece_box_squares: 1.0

  transforms:
    # Preserve the entire photo; center with black padding on only one axis.
    - KeypointsLetterbox:
        output_height: ${dataset_params.image_height}
        output_width: ${dataset_params.image_width}
        image_pad_value: [0, 0, 0]
        mask_pad_value: 1

    - KeypointsImageStandardize:
        max_value: 255


train_dataloader_params:
  dataset: ChessPoseEstimationDataset
  shuffle: True
  batch_size: 32
  # Throughput levels off from 12 workers on the 16-core training PC.
  num_workers: 16
  drop_last: True
  pin_memory: True
  persistent_workers: True
  collate_fn: ChessYoloNASPoseCollateFN

val_dataloader_params:
  dataset: ChessPoseEstimationDataset
  batch_size: 32
  num_workers: 8
  drop_last: False
  pin_memory: True
  persistent_workers: True
  collate_fn: ChessYoloNASPoseCollateFN
